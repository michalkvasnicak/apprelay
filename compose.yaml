name: apprelay

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apprelay
      POSTGRES_USER: apprelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal-data-init:
    image: temporalio/temporal:1.6.2
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /data"]
    volumes:
      - temporal-data:/data

  temporal:
    image: temporalio/temporal:1.6.2
    restart: unless-stopped
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APPRELAY_HTTPS_HOST: ${APPRELAY_HTTPS_HOST:-localhost}
      APPRELAY_API_UPSTREAM: ${APPRELAY_API_UPSTREAM:-host.lima.internal:8080}
    ports:
      - "${APPRELAY_HTTPS_BIND:-127.0.0.1}:8443:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  temporal-data:
  caddy-data:
  caddy-config:
