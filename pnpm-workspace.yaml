packages:
  - apps/*
  - apps/server/web
  - packages/*

# Sentry's declarations import React types without declaring their peer.
packageExtensions:
  "@sentry/react@10.78.0":
    peerDependencies:
      "@types/react": "^17 || ^18 || ^19"
  "@sentry/react@11.13.0":
    peerDependencies:
      "@types/react": "^17 || ^18 || ^19"
