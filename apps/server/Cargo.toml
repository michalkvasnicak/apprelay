[package]
name = "apprelay-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
default-run = "apprelay-server"

[[bin]]
name = "vpn-agent"
path = "src/bin/vpn-agent.rs"

[[bin]]
name = "pairing-worker"
path = "src/bin/pairing-worker.rs"

[[bin]]
name = "notification-worker"
path = "src/bin/notification-worker.rs"

[[bin]]
name = "pair-device"
path = "src/bin/pair-device.rs"

[[test]]
name = "devices"
path = "tests/devices.rs"
required-features = ["test-support"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
test-support = []
# Enable for stripped builds that upload matching debug information.
sentry-debug-images = ["sentry/debug-images"]

[dependencies]
aws-sdk-s3 = { version = "1.115", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22"
brotli-decompressor = "5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
cms = "0.2"
der = "0.7"
flate2 = "1"
fred = { version = "10.1", default-features = false, features = ["enable-rustls-ring"] }
hickory-proto = { version = "0.24", default-features = false, features = ["mdns"] }
hkdf = "0.12"
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = ["afc", "installation_proxy", "remote_pairing", "ring", "rsd", "tcp", "tunnel_tcp_stack"] }
ipnet = "2"
libc = "0.2"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sentry = { version = "0.49.6", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider", "tower"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-rate-limit-fred = "2.1.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
zeroize = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
debug = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
futures = "0.3"
temporalio-client = "=1.2.0"
temporalio-common = "=1.2.0"
temporalio-macros = "=1.2.0"
temporalio-sdk = "=1.2.0"
temporalio-workflow = "=1.2.0"
