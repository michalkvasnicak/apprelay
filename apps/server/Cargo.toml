[package]
name = "apprelay-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
default-run = "apprelay-server"

[[bin]]
name = "vpn-agent"
path = "src/bin/vpn-agent.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
